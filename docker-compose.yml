services:
  api:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: ${PORT:-8080}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-go-boilerplate}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
    expose:
      - "${PORT:-8080}"
    networks:
      app_network:
      db_network:
      proxy_network:
        aliases:
          - ${PROXY_ALIAS:-go-boilerplate-api}
    restart: unless-stopped

  migrate:
    build: .
    profiles:
      - tools
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-}
    entrypoint: ["/app/migrate"]
    volumes:
      - ./migrations:/app/migrations
    networks:
      - app_network
      - db_network

  seed:
    build: .
    profiles:
      - tools
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-}
    entrypoint: ["/app/seed"]
    networks:
      - app_network
      - db_network

networks:
  app_network:
    driver: bridge
  proxy_network:
    external: true
    name: ${PROXY_NETWORK:-proxy_network}
  db_network:
    external: true
    name: ${DB_NETWORK:-db_network}
